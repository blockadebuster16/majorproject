services:
  # Next.js Application & API Gateway
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@db:5432/signbridge
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-}
      - BACKEND_URL=${BACKEND_URL:-}
      - SIGN_MODEL_ENDPOINT=${SIGN_MODEL_ENDPOINT:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - signbridge-net

  # PostgreSQL Relational Database (Application Persistence)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: signbridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations/20260301000000_init_schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d signbridge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signbridge-net

networks:
  signbridge-net:
    driver: bridge

volumes:
  pgdata:
